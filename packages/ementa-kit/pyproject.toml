[project]
name = "ementa-kit"
version = "0.1.0"
description = "Reusable, domain-free building blocks for AI agents"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-sdk>=1.38",
    "pydantic-settings>=2.11",
    "structlog>=25.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
