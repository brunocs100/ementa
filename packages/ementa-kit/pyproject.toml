[project]
name = "ementa-kit"
version = "0.1.0"
description = "Reusable, domain-free building blocks for AI agents"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastembed>=0.9",
    "langchain-core>=1.8",
    "langchain-openai>=1.8",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    # openai-v2 2.4b0 imports a module that util-genai 1.x renamed
    "opentelemetry-util-genai>=0.4b0,<1",
    "opentelemetry-sdk>=1.38",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.11",
    "pyyaml>=6.0",
    "structlog>=25.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
