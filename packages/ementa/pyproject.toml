[project]
name = "ementa"
version = "0.1.0"
description = "Legal domain for the Ementa agents"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "ementa-kit",
    "langgraph>=1.2",
    "presidio-analyzer>=2.2.366",
    # text of uploaded PDFs (pure Python, BSD); scanned PDFs have no text and are refused
    "pypdf>=6.21",
    # the contract playbook in data/firm/playbooks (already a dependency of the kit)
    "pyyaml>=6.0",
]

[project.scripts]
ementa = "ementa.cli:main"

[tool.uv.sources]
ementa-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
