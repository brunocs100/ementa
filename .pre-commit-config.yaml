# Fast checks before each commit: `uvx pre-commit install` once per clone.
# CI runs the same hooks, plus mypy, import-linter, pytest, gitleaks and pip-audit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^data/corpus/raw/
      - id: trailing-whitespace
        exclude: ^data/corpus/raw/
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^data/corpus/raw/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
