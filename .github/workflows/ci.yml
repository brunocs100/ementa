name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ementa
          POSTGRES_PASSWORD: ementa
          POSTGRES_DB: ementa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ementa -d ementa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EMENTA_ENV: ci
      EMENTA_OTEL_ENABLED: "false"
      # Integration tests (hybrid search SQL) run against this service; locally they skip.
      EMENTA_TEST_DATABASE_URL: postgresql://ementa:ementa@localhost:5432/ementa
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps
      - run: uv run lint-imports
      - run: uv run pytest -m "not eval"

  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --exit-code 1 .
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: pip-audit on the locked dependencies
        run: |
          uv export --frozen --all-groups --no-emit-workspace --format requirements-txt -o requirements-audit.txt
          uvx pip-audit@2.10.1 -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start core and obs profiles and wait until healthy
        run: docker compose --profile core --profile obs up -d --wait --wait-timeout 300
      - name: Check extensions
        run: >
          docker compose exec -T postgres
          psql -U ementa -d ementa -tAc
          "select string_agg(extname, ',' order by extname) from pg_extension"
          | grep -q "unaccent,vector"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Send a test span through the kit and find it in Grafana
        run: |
          trace_id=$(uv run python - <<'EOF' | grep -m1 -E '^[0-9a-f]{32}$'
          from opentelemetry import trace

          from ementa_kit.config import get_settings
          from ementa_kit.telemetry import setup

          provider = setup(get_settings())
          with trace.get_tracer("ci").start_as_current_span("ci-smoke") as span:
              trace_id = format(span.get_span_context().trace_id, "032x")
          provider.force_flush()
          print(trace_id)
          EOF
          )
          echo "trace id: $trace_id"
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:3000/api/datasources/proxy/uid/tempo/api/traces/$trace_id" > /dev/null; then
              echo "Found in Tempo through the Grafana API"
              exit 0
            fi
            sleep 2
          done
          echo "Trace $trace_id not found in Tempo"
          exit 1
      - if: always()
        run: docker compose --profile core --profile obs down -v
