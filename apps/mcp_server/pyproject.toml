[project]
name = "ementa-mcp"
version = "0.1.0"
description = "MCP server exposing the Ementa tools"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["ementa", "ementa-kit", "mcp>=2.3"]

[project.scripts]
ementa-mcp = "ementa_mcp.server:main"

[tool.uv.sources]
ementa = { workspace = true }
ementa-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
