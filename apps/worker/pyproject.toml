[project]
name = "ementa-worker"
version = "0.1.0"
description = "Background worker (arq on Redis) for the Ementa jobs"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["arq>=0.28", "ementa", "ementa-kit"]

[project.scripts]
ementa-worker = "ementa_worker.main:main"

[tool.uv.sources]
ementa = { workspace = true }
ementa-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
